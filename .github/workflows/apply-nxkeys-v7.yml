name: Apply NXKeys v7 ergonomic map

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-nxkeys-v7.py
      - .github/workflows/apply-nxkeys-v7.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply ergonomic migration
        shell: pwsh
        run: python scripts/apply-nxkeys-v7.py

      - name: Rebuild generated main profile
        shell: pwsh
        run: node scripts/compile-main-command-map.mjs --profile config/nx2512-pro-hybrid.json --out config/nx2512-pro-main.generated.json --report docs/generated/main-profile-resolution.md

      - name: Validate command maps
        shell: pwsh
        run: |
          node scripts/validate-command-tree.mjs
          node scripts/validate-main-command-map.mjs
          node scripts/validate-full-command-map.mjs
          node scripts/audit-command-sequences.mjs

      - name: Run state-machine tests
        shell: pwsh
        run: dotnet test NXKeys.StateMachines.Tests/NXKeys.StateMachines.Tests.csproj -c Release

      - name: Remove one-time migration files
        shell: pwsh
        run: |
          Remove-Item scripts/apply-nxkeys-v7.py
          Remove-Item .github/workflows/apply-nxkeys-v7.yml

      - name: Commit to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Implement NXKeys v7 ergonomic command map"
          git push origin HEAD:main
