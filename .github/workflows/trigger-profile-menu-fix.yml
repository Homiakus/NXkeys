name: Trigger profile editor and command menu fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/profile-menu-fix.trigger'
  pull_request:
    paths:
      - '.github/profile-menu-fix.trigger'
      - '.github/workflows/trigger-profile-menu-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract and run reviewed patch
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/apply-profile-menu-fix.yml -Raw
          $match = [regex]::Match($workflow, "(?s)@'\r?\n(.*?)\r?\n\s*'@ \| Set-Content -LiteralPath \.\\apply-profile-menu-fix\.py")
          if (-not $match.Success) { throw 'Embedded patch script was not found.' }
          $lines = $match.Groups[1].Value -split "`r?`n"
          $nonEmpty = @($lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $indent = if ($nonEmpty.Count -gt 0) { ($nonEmpty | ForEach-Object { ([regex]::Match($_, '^\s*')).Value.Length } | Measure-Object -Minimum).Minimum } else { 0 }
          $script = ($lines | ForEach-Object {
            if ($_.Length -ge $indent) { $_.Substring($indent) } else { $_ }
          }) -join "`n"
          $script = $script.Replace("'''      - name: Run profile editor and command-menu regressions", "r'''      - name: Run profile editor and command-menu regressions")
          $replacementFunction = @'
          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              pieces = [piece for piece in re.split(r'(\s+)', old) if piece]
              pattern = ''.join(r'\s+' if piece.isspace() else re.escape(piece) for piece in pieces)
              updated, count = re.subn(pattern, lambda match: new, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one whitespace-tolerant match, found {count}: {old[:120]!r}')
              write(path, updated)
          '@
          $replacementFunction = ($replacementFunction -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $script = [regex]::Replace($script, '(?s)def replace_once\(path, old, new\):.*?(?=\ndef regex_once)', $replacementFunction + "`n`n", 1)
          [IO.File]::WriteAllText((Join-Path $PWD 'apply-profile-menu-fix.py'), $script, [Text.UTF8Encoding]::new($false))
          python .\apply-profile-menu-fix.py
          Remove-Item .\apply-profile-menu-fix.py -Force

      - name: Validate generated profiles
        shell: pwsh
        run: |
          node .\scripts\validate-command-tree.mjs
          node .\scripts\validate-main-command-map.mjs

      - name: Run profile editor regressions
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release -p:Platform=x64 --nologo

      - name: Build HotkeyStudio
        shell: pwsh
        run: dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo

      - name: Commit validated fixes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-profile-menu-fix.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/trigger-profile-menu-fix.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/profile-menu-fix.trigger -Force -ErrorAction SilentlyContinue
          Remove-Item .github/profile-menu-fix-pr.trigger -Force -ErrorAction SilentlyContinue
          Remove-Item .github/profile-menu-fix-pr-run.txt -Force -ErrorAction SilentlyContinue
          Remove-Item .github/profile-menu-fix-pr-run-2.txt -Force -ErrorAction SilentlyContinue
          git add -A
          git diff --check
          if (git diff --cached --quiet) { throw 'Patch produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix canonical profile editing and complete command menus'
          $target = if ('${{ github.event_name }}' -eq 'pull_request') { '${{ github.head_ref }}' } else { 'main' }
          git push origin "HEAD:$target"
