name: Apply authenticated IPC phase one

on:
  push:
    branches:
      - agent/authenticated-ipc-phase1
    paths:
      - scripts/apply-authenticated-ipc-phase1.py
      - .github/workflows/apply-authenticated-ipc-phase1.yml

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authenticated-ipc-phase1
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply authenticated IPC migration
        shell: pwsh
        run: python .\scripts\apply-authenticated-ipc-phase1.py

      - name: Validate profiles, commands and documentation
        shell: pwsh
        run: |
          node .\scripts\validate-main-command-map.mjs
          node .\scripts\validate-command-tree.mjs
          node .\scripts\validate-documentation.mjs

      - name: Run state-machine tests
        shell: pwsh
        run: dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo

      - name: Run authenticated IPC regressions
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release --nologo

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo
          dotnet build .\NX2512_ControlCenter\NX2512_ControlCenter.csproj -c Release -p:Platform=x64 --nologo

      - name: Build NXOpen contract stubs
        shell: pwsh
        run: dotnet build .\NX2512_CommandBridge.Tests\NXOpenUI\NXOpenUI.csproj -c Release -o .\artifacts\nxopen-contract --nologo

      - name: Compile Command Bridge against NXOpen contract
        shell: pwsh
        run: |
          $nxOpenDir = (Resolve-Path .\artifacts\nxopen-contract).Path
          dotnet build .\NX2512_CommandBridge\NX2512_CommandBridge.csproj -c Release -p:Platform=x64 -p:NXOpenDir="$nxOpenDir" --nologo

      - name: Commit authenticated IPC source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- scripts/apply-authenticated-ipc-phase1.py .github/workflows/apply-authenticated-ipc-phase1.yml
          if (git diff --cached --quiet) { throw 'Migration produced no source changes.' }
          git commit -m "Authenticate NX Bridge IPC"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/authenticated-ipc-phase1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
