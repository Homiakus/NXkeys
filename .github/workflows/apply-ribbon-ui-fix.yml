name: Apply NX ribbon UI fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/ribbon-ui-fix.trigger'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply reviewed ribbon patch
        shell: pwsh
        run: python .\scripts\apply-ribbon-ui-fix.py

      - name: Verify single ribbon deployment
        shell: pwsh
        run: |
          $deployment = Get-Content .\NX2512_HotkeyStudio\Services\DeploymentEngine.cs -Raw
          if ($deployment.Contains('Path.Combine(startup, "nxkeys_ribbon.rtb")')) {
            throw 'Legacy startup ribbon deployment is still present.'
          }
          if (-not $deployment.Contains('NxRibbonLayout.CanonicalRelativePath')) {
            throw 'Canonical ribbon deployment is missing.'
          }

      - name: Run HotkeyStudio regressions
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release -p:Platform=x64 --nologo

      - name: Build HotkeyStudio
        shell: pwsh
        run: dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo

      - name: Commit validated source changes to main
        shell: pwsh
        run: |
          Remove-Item .\scripts\apply-ribbon-ui-fix.py -Force
          Remove-Item .\.github\ribbon-ui-fix.trigger -Force
          git add -A
          git diff --check
          if (git diff --cached --quiet) { throw 'Ribbon patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix duplicate NXKeys ribbon and compact labels'
          git push origin HEAD:main
