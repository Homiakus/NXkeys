name: Main Profile Runtime

on:
  push:
    paths:
      - 'config/full-command-map/**'
      - 'config/nx2512-pro-hybrid.json'
      - 'scripts/compile-full-command-map.mjs'
      - 'scripts/compile-main-command-map.mjs'
      - 'scripts/validate-main-command-map.mjs'
      - 'NX2512_HotkeyStudio/**'
      - 'NXKeys.StateMachines/**'
      - 'NXKeys.StateMachines.Tests/**'
      - 'README.md'
      - 'FULL_COMMAND_MAP.md'
      - 'docs/**'
      - '.github/workflows/main-profile-runtime.yml'
  pull_request:
    paths:
      - 'config/full-command-map/**'
      - 'config/nx2512-pro-hybrid.json'
      - 'scripts/compile-full-command-map.mjs'
      - 'scripts/compile-main-command-map.mjs'
      - 'scripts/validate-main-command-map.mjs'
      - 'NX2512_HotkeyStudio/**'
      - 'NXKeys.StateMachines/**'
      - 'NXKeys.StateMachines.Tests/**'
      - 'README.md'
      - 'FULL_COMMAND_MAP.md'
      - 'docs/**'
      - '.github/workflows/main-profile-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate K3-K5 source and generated profiles
        shell: pwsh
        run: node .\scripts\validate-main-command-map.mjs

      - name: Compile canonical main profile
        shell: pwsh
        run: |
          node .\scripts\compile-main-command-map.mjs `
            --profile .\config\nx2512-pro-hybrid.json `
            --intents .\config\full-command-map `
            --probe .\docs\audit\runtime-command-probe-2026-07-28.json `
            --out .\artifacts\nx2512-pro-main.generated.json `
            --report .\artifacts\main-profile-resolution.md
          $profile = Get-Content .\artifacts\nx2512-pro-main.generated.json -Raw | ConvertFrom-Json
          if ([int]$profile.full_command_catalog.selected_intents -ne 885) { throw 'Main profile must contain 885 selected intents.' }
          if ((@($profile.full_command_catalog.selected_frequencies) -join ',') -ne 'K3,K4,K5') { throw 'Main profile must select K3,K4,K5.' }

      - name: Build HotkeyStudio through build.ps1 without a prebuilt Bridge
        shell: pwsh
        run: |
          if (Test-Path .\NX2512_CommandBridge\dist\NX2512_CommandBridge.dll) {
            throw 'Regression precondition failed: CommandBridge must not be prebuilt.'
          }
          & .\NX2512_HotkeyStudio\build.ps1 `
            -ProfilePath .\artifacts\nx2512-pro-main.generated.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\NX2512_HotkeyStudio\dist\NX2512_HotkeyStudio.exe -PathType Leaf)) {
            throw 'HotkeyStudio build script did not produce the executable.'
          }
          New-Item -ItemType Directory -Force -Path .\artifacts\hotkey-studio | Out-Null
          Copy-Item .\NX2512_HotkeyStudio\dist\* .\artifacts\hotkey-studio -Recurse -Force

      - name: Validate main profile through C# CLI
        shell: pwsh
        run: |
          & .\artifacts\hotkey-studio\NX2512_HotkeyStudio.exe validate `
            --config .\artifacts\hotkey-studio\nx2512-pro-hybrid.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run state-machine tests
        shell: pwsh
        run: dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: nxkeys-main-k3-k5-profile
          path: |
            artifacts/nx2512-pro-main.generated.json
            artifacts/main-profile-resolution.md
            artifacts/hotkey-studio
