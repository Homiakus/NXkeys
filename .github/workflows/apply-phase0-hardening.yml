name: Apply phase-zero runtime hardening

on:
  push:
    branches:
      - agent/harden-nx-runtime-phase0
    paths:
      - scripts/apply-phase0-hardening.py
      - .github/workflows/apply-phase0-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-phase0-hardening.py
      - .github/workflows/apply-phase0-hardening.yml

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-nx-runtime-phase0
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply hardening migration
        shell: pwsh
        run: python .\scripts\apply-phase0-hardening.py

      - name: Validate profiles and command trees
        shell: pwsh
        run: |
          node .\scripts\validate-main-command-map.mjs
          node .\scripts\validate-command-tree.mjs
          node .\scripts\validate-full-command-map.mjs

      - name: Run state-machine tests
        shell: pwsh
        run: dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo

      - name: Run HotkeyStudio hardening tests
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release --nologo

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo
          dotnet build .\NX2512_ControlCenter\NX2512_ControlCenter.csproj -c Release -p:Platform=x64 --nologo

      - name: Build NXOpen contract stubs
        shell: pwsh
        run: dotnet build .\NX2512_CommandBridge.Tests\NXOpenUI\NXOpenUI.csproj -c Release -o .\artifacts\nxopen-contract --nologo

      - name: Compile Command Bridge against contract
        shell: pwsh
        run: |
          $nxOpenDir = (Resolve-Path .\artifacts\nxopen-contract).Path
          dotnet build .\NX2512_CommandBridge\NX2512_CommandBridge.csproj -c Release -p:Platform=x64 -p:NXOpenDir="$nxOpenDir" --nologo

      - name: Commit hardened runtime source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            NXKeys.Protocol/NxProtocol.cs \
            NX2512_HotkeyStudio/Models/ConfigRuntimeV5.cs \
            NX2512_HotkeyStudio/Services/NxTransportReadResult.cs \
            NX2512_HotkeyStudio/Services/NxCommandBridgeClient.cs \
            NX2512_CommandBridge/Program.cs \
            NX2512_HotkeyStudio.Tests/Program.cs \
            docs/api.md \
            docs/SAFETY_MODEL.md \
            docs/NX_PLUGIN_FRAGILITY_ARCHITECTURE_UI_AUDIT.md \
            CHANGELOG.md
          if (git diff --cached --quiet) { throw 'Migration produced no source changes.' }
          git commit -m "Harden NX runtime phase zero"
          git push origin HEAD:agent/harden-nx-runtime-phase0
