name: Deploy NXKeys Command Map

on:
  push:
    branches:
      - main
    paths:
      - "docs/command-tree.html"
      - "config/nx2512-pro-hybrid.json"
      - "config/nx2512-state-machines.json"
      - "scripts/validate-command-tree.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static command map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate mnemonic profile
        run: node scripts/validate-command-tree.mjs

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/config

          cp docs/command-tree.html _site/index.html
          cp config/nx2512-pro-hybrid.json _site/config/
          cp config/nx2512-state-machines.json _site/config/

          # command-tree.html is stored under docs/ in the repository, but is
          # published as index.html at the root of the Pages site.
          sed -i 's#\.\./config/#./config/#g' _site/index.html

          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/config/nx2512-pro-hybrid.json
          test -s _site/config/nx2512-state-machines.json
          grep -q './config/nx2512-pro-hybrid.json' _site/index.html
          grep -q './config/nx2512-state-machines.json' _site/index.html

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
