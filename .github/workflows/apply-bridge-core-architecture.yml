name: Apply BridgeCore architecture

on:
  push:
    branches:
      - agent/bridge-core-architecture
    paths:
      - scripts/apply-bridge-core-architecture.py
      - scripts/fix-bridge-core-migration.py
      - scripts/fix-bridge-core-null-snapshot.py
      - .github/workflows/apply-bridge-core-architecture.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-bridge-core-architecture.py
      - scripts/fix-bridge-core-migration.py
      - scripts/fix-bridge-core-null-snapshot.py
      - .github/workflows/apply-bridge-core-architecture.yml

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bridge-core-architecture
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply BridgeCore architecture migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\apply-bridge-core-architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\scripts\fix-bridge-core-migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\scripts\fix-bridge-core-null-snapshot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate profiles and documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node .\scripts\validate-main-command-map.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\validate-command-tree.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\validate-documentation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build architectural class libraries
        shell: pwsh
        run: |
          dotnet build .\NXKeys.Protocol\NXKeys.Protocol.csproj -c Release --nologo -warnaserror
          dotnet build .\NXKeys.BridgeCore\NXKeys.BridgeCore.csproj -c Release --nologo -warnaserror

      - name: Run state-machine and BridgeCore regressions
        shell: pwsh
        run: |
          dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo
          dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release --nologo

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo
          dotnet build .\NX2512_ControlCenter\NX2512_ControlCenter.csproj -c Release -p:Platform=x64 --nologo

      - name: Build NXOpen contract stubs
        shell: pwsh
        run: dotnet build .\NX2512_CommandBridge.Tests\NXOpenUI\NXOpenUI.csproj -c Release -o .\artifacts\nxopen-contract --nologo

      - name: Compile Command Bridge against contract
        shell: pwsh
        run: |
          $nxOpenDir = (Resolve-Path .\artifacts\nxopen-contract).Path
          dotnet build .\NX2512_CommandBridge\NX2512_CommandBridge.csproj -c Release -p:Platform=x64 -p:NXOpenDir="$nxOpenDir" --nologo

      - name: Commit BridgeCore architecture source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- scripts/apply-bridge-core-architecture.py scripts/fix-bridge-core-migration.py scripts/fix-bridge-core-null-snapshot.py .github/workflows/apply-bridge-core-architecture.yml .github/workflows/runtime-hardening.yml
          if (git diff --cached --quiet) { throw 'Migration produced no source changes.' }
          git commit -m "Extract BridgeCore architecture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin agent/bridge-core-architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/agent/bridge-core-architecture
          if ($LASTEXITCODE -ne 0) { git rebase --abort; exit 1 }
          git push origin HEAD:agent/bridge-core-architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
