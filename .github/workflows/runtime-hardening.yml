name: Runtime hardening

on:
  push:
    paths:
      - 'NXKeys.Protocol/**'
      - 'NX2512_HotkeyStudio/Models/ConfigRuntimeV5.cs'
      - 'NX2512_HotkeyStudio/Services/NxCommandBridgeClient.cs'
      - 'NX2512_HotkeyStudio/Services/NxTransportReadResult.cs'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - 'NXKeys.StateMachines.Tests/**'
      - '.github/workflows/runtime-hardening.yml'
  pull_request:
    paths:
      - 'NXKeys.Protocol/**'
      - 'NX2512_HotkeyStudio/Models/ConfigRuntimeV5.cs'
      - 'NX2512_HotkeyStudio/Services/NxCommandBridgeClient.cs'
      - 'NX2512_HotkeyStudio/Services/NxTransportReadResult.cs'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - 'NXKeys.StateMachines.Tests/**'
      - '.github/workflows/runtime-hardening.yml'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate phase-zero source invariants
        shell: pwsh
        run: |
          $protocol = Get-Content .\NXKeys.Protocol\NxProtocol.cs -Raw
          $config = Get-Content .\NX2512_HotkeyStudio\Models\ConfigRuntimeV5.cs -Raw
          $client = Get-Content .\NX2512_HotkeyStudio\Services\NxCommandBridgeClient.cs -Raw
          $bridge = Get-Content .\NX2512_CommandBridge\Program.cs -Raw
          foreach ($required in @(
            'NxProtocolActions.IsSupported',
            'expected_selection_fingerprint',
            'selection_fingerprint',
            'MaxRequestPayloadBytes',
            'MaxPendingRequestCount',
            'MaxRequestsPerPoll'
          )) {
            if ($protocol -notmatch [regex]::Escape($required)) {
              throw "Missing protocol hardening invariant: $required"
            }
          }
          foreach ($required in @('ValidateSourceSchemaVersion', 'AtomicFileWriter.WriteAllText')) {
            if ($config -notmatch [regex]::Escape($required)) {
              throw "Missing profile hardening invariant: $required"
            }
          }
          foreach ($required in @('ReadContextDetailed', 'ReadResultDetailed', 'NxTransportReadStatus')) {
            if ($client -notmatch [regex]::Escape($required)) {
              throw "Missing typed transport invariant: $required"
            }
          }
          foreach ($required in @(
            'Take(NxProtocolConstants.MaxRequestsPerPoll)',
            'Unsupported NXKeys action',
            'ExpectedSelectionFingerprint',
            'AskSelectionSnapshot'
          )) {
            if ($bridge -notmatch [regex]::Escape($required)) {
              throw "Missing Bridge hardening invariant: $required"
            }
          }

      - name: Run state-machine and protocol tests
        shell: pwsh
        run: dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo

      - name: Run profile and transport regression tests
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release --nologo

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo
          dotnet build .\NX2512_ControlCenter\NX2512_ControlCenter.csproj -c Release -p:Platform=x64 --nologo

      - name: Build NXOpen contract stubs
        shell: pwsh
        run: dotnet build .\NX2512_CommandBridge.Tests\NXOpenUI\NXOpenUI.csproj -c Release -o .\artifacts\nxopen-contract --nologo

      - name: Compile Command Bridge against NXOpen contract
        shell: pwsh
        run: |
          $nxOpenDir = (Resolve-Path .\artifacts\nxopen-contract).Path
          dotnet build .\NX2512_CommandBridge\NX2512_CommandBridge.csproj -c Release -p:Platform=x64 -p:NXOpenDir="$nxOpenDir" --nologo
