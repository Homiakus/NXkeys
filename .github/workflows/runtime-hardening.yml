name: Runtime hardening

on:
  push:
    paths:
      - 'NXKeys.Protocol/**'
      - 'NXKeys.BridgeCore/**'
      - 'NX2512_HotkeyStudio/Models/ConfigRuntimeV5.cs'
      - 'NX2512_HotkeyStudio/Program.cs'
      - 'NX2512_HotkeyStudio/Services/LeaderKeyEngine.cs'
      - 'NX2512_HotkeyStudio/Services/NxCommandBridgeClient.cs'
      - 'NX2512_HotkeyStudio/Services/NxRequestSigningPolicy.cs'
      - 'NX2512_HotkeyStudio/Services/NxRuntimeService.cs'
      - 'NX2512_HotkeyStudio/Services/NxTransportReadResult.cs'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - 'NXKeys.StateMachines.Tests/**'
      - 'config/nx2512-state-machines.json'
      - '.github/workflows/runtime-hardening.yml'
  pull_request:
    paths:
      - 'NXKeys.Protocol/**'
      - 'NXKeys.BridgeCore/**'
      - 'NX2512_HotkeyStudio/Models/ConfigRuntimeV5.cs'
      - 'NX2512_HotkeyStudio/Program.cs'
      - 'NX2512_HotkeyStudio/Services/LeaderKeyEngine.cs'
      - 'NX2512_HotkeyStudio/Services/NxCommandBridgeClient.cs'
      - 'NX2512_HotkeyStudio/Services/NxRequestSigningPolicy.cs'
      - 'NX2512_HotkeyStudio/Services/NxRuntimeService.cs'
      - 'NX2512_HotkeyStudio/Services/NxTransportReadResult.cs'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - 'NXKeys.StateMachines.Tests/**'
      - 'config/nx2512-state-machines.json'
      - '.github/workflows/runtime-hardening.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate runtime hardening source invariants
        shell: pwsh
        run: |
          $protocol = Get-Content .\NXKeys.Protocol\NxProtocol.cs -Raw
          $security = Get-Content .\NXKeys.Protocol\NxBridgeSecurity.cs -Raw
          $gate = Get-Content .\NXKeys.BridgeCore\BridgeSecurityGate.cs -Raw
          $inbox = Get-Content .\NXKeys.BridgeCore\BridgeRequestInbox.cs -Raw
          $config = Get-Content .\NX2512_HotkeyStudio\Models\ConfigRuntimeV5.cs -Raw
          $client = Get-Content .\NX2512_HotkeyStudio\Services\NxCommandBridgeClient.cs -Raw
          $signingPolicy = Get-Content .\NX2512_HotkeyStudio\Services\NxRequestSigningPolicy.cs -Raw
          $transportReadResult = Get-Content .\NX2512_HotkeyStudio\Services\NxTransportReadResult.cs -Raw
          $runtime = Get-Content .\NX2512_HotkeyStudio\Services\NxRuntimeService.cs -Raw
          $leader = Get-Content .\NX2512_HotkeyStudio\Services\LeaderKeyEngine.cs -Raw
          $desktop = Get-Content .\NX2512_HotkeyStudio\Program.cs -Raw
          $bridge = Get-Content .\NX2512_CommandBridge\Program.cs -Raw

          foreach ($required in @(
            'NxProtocolActions.IsSupported',
            'expected_selection_fingerprint',
            'selection_fingerprint',
            'MaxRequestPayloadBytes',
            'MaxPendingRequestCount',
            'MaxRequestsPerPoll',
            'session_id',
            'client_instance_id',
            'payload_hmac'
          )) {
            if ($protocol -notmatch [regex]::Escape($required)) {
              throw "Missing protocol hardening invariant: $required"
            }
          }
          foreach ($required in @(
            'NxRequestAuthenticator',
            'NxBridgePermissionSet',
            'NxReplayGuard',
            'FixedTimeEquals',
            'HMACSHA256'
          )) {
            if ($security -notmatch [regex]::Escape($required)) {
              throw "Missing authenticated IPC invariant: $required"
            }
          }
          foreach ($required in @('BridgeSecurityGate', 'ValidateSourceProcess', 'NxReplayGuard', 'activePermissions')) {
            if ($gate -notmatch [regex]::Escape($required)) {
              throw "Missing BridgeCore security invariant: $required"
            }
          }
          foreach ($required in @('BridgeRequestInbox', 'AutoResetEvent', 'MaxRequestsPerPoll', 'TryDequeueRejected', 'File.Move')) {
            if ($inbox -notmatch [regex]::Escape($required)) {
              throw "Missing background inbox invariant: $required"
            }
          }
          foreach ($required in @('ValidateSourceSchemaVersion', 'AtomicFileWriter.WriteAllText')) {
            if ($config -notmatch [regex]::Escape($required)) {
              throw "Missing profile hardening invariant: $required"
            }
          }
          foreach ($required in @(
            'ReadContextDetailed',
            'ReadResultDetailed',
            'policy.PrepareAuthenticated',
            'transport.WriteRequest'
          )) {
            if ($client -notmatch [regex]::Escape($required)) {
              throw "Missing client orchestration invariant: $required"
            }
          }
          foreach ($required in @(
            'PrepareAuthenticated',
            'NxBridgeSecurityEnvironment.TryRead',
            'NxBridgePermissionSet.FromProfileFile',
            'NxRequestAuthenticator.Sign'
          )) {
            if ($signingPolicy -notmatch [regex]::Escape($required)) {
              throw "Missing signing-policy invariant: $required"
            }
          }
          foreach ($required in @('NxTransportReadStatus', 'NxTransportReadResult', 'IsSuccess')) {
            if ($transportReadResult -notmatch [regex]::Escape($required)) {
              throw "Missing transport read-result invariant: $required"
            }
          }
          foreach ($required in @(
            'NxBridgeSecurityEnvironment.SessionSecretVariable',
            'RandomNumberGenerator.GetBytes(32)',
            'ApplySecurityEnvironment'
          )) {
            if ($runtime -notmatch [regex]::Escape($required)) {
              throw "Missing secure launch invariant: $required"
            }
          }
          foreach ($required in @('BridgeRequestInbox', 'ProcessClaim', 'TryDequeueRejected', 'TryDequeue(out')) {
            if ($bridge -notmatch [regex]::Escape($required)) {
              throw "Missing bounded NX adapter invariant: $required"
            }
          }
          if ($bridge -match [regex]::Escape('Directory.GetFiles(PendingDirectory')) {
            throw 'NX UI adapter must not enumerate the pending directory.'
          }
          if ($bridge -match [regex]::Escape('NxRequestAuthenticator.Verify')) {
            throw 'NX UI adapter must not perform cryptographic admission directly.'
          }
          foreach ($required in @('Local\\', 'signalCancellation', 'thread.Join(500)')) {
            if ($desktop -notmatch [regex]::Escape($required)) {
              throw "Missing desktop lifecycle invariant: $required"
            }
          }
          foreach ($required in @('capsLockStateBeforeTrigger', 'EnsureCapsLockState')) {
            if ($leader -notmatch [regex]::Escape($required)) {
              throw "Missing CapsLock preservation invariant: $required"
            }
          }
          if ($leader -match [regex]::Escape('EnsureCapsLockOff')) {
            throw 'Leader must not force CapsLock off.'
          }

      - name: Build strict architecture libraries
        shell: pwsh
        run: |
          dotnet build .\NXKeys.Protocol\NXKeys.Protocol.csproj -c Release --nologo -warnaserror
          dotnet build .\NXKeys.BridgeCore\NXKeys.BridgeCore.csproj -c Release --nologo -warnaserror

      - name: Run state-machine and protocol tests
        shell: pwsh
        run: dotnet run --project .\NXKeys.StateMachines.Tests\NXKeys.StateMachines.Tests.csproj -c Release --nologo

      - name: Run profile, transport, authentication and inbox regressions
        shell: pwsh
        run: dotnet run --project .\NX2512_HotkeyStudio.Tests\NX2512_HotkeyStudio.Tests.csproj -c Release --nologo

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build .\NX2512_HotkeyStudio\NX2512_HotkeyStudio.csproj -c Release -p:Platform=x64 --nologo
          dotnet build .\NX2512_ControlCenter\NX2512_ControlCenter.csproj -c Release -p:Platform=x64 --nologo

      - name: Build NXOpen contract stubs
        shell: pwsh
        run: dotnet build .\NX2512_CommandBridge.Tests\NXOpenUI\NXOpenUI.csproj -c Release -o .\artifacts\nxopen-contract --nologo

      - name: Compile Command Bridge against NXOpen contract
        shell: pwsh
        run: |
          $nxOpenDir = (Resolve-Path .\artifacts\nxopen-contract).Path
          dotnet build .\NX2512_CommandBridge\NX2512_CommandBridge.csproj -c Release -p:Platform=x64 -p:NXOpenDir="$nxOpenDir" --nologo
