name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/**'
      - 'config/**'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio/Models/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - '.github/workflows/documentation.yml'
  push:
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/**'
      - 'config/**'
      - 'NX2512_CommandBridge/**'
      - 'NX2512_HotkeyStudio/Models/**'
      - 'NX2512_HotkeyStudio.Tests/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate current command tree
        run: node .\scripts\validate-command-tree.mjs

      - name: Validate capability route lock
        run: node .\scripts\validate-capability-route-lock.mjs

      - name: Validate documentation
        run: node .\scripts\validate-documentation.mjs
