name: Documentation refresh helper

on:
  push:
    branches:
      - docs/current-documentation-cheatsheet

permissions:
  contents: write

concurrency:
  group: docs-refresh-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate sequence audit
        run: node .\scripts\audit-command-sequences.mjs

      - name: Verify generated policy version
        shell: pwsh
        run: |
          $source = Get-Content .\scripts\sequence-policy.mjs -Raw
          $audit = Get-Content .\docs\audit\command-sequence-audit.md -Raw
          $sourceVersion = [regex]::Match($source, 'SEQUENCE_POLICY_VERSION\s*=\s*(\d+)').Groups[1].Value
          $auditVersion = [regex]::Match($audit, 'Sequence policy:\s*\*\*v(\d+)\*\*').Groups[1].Value
          if (-not $sourceVersion -or $sourceVersion -ne $auditVersion) {
            throw "Generated audit policy v$($auditVersion) does not match source v$($sourceVersion)."
          }

      - name: Commit regenerated artifacts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/command-sequence-audit.md docs/audit/command-sequence-audit.json
          if (git diff --cached --quiet) {
            Write-Host "Generated audit is already current."
            exit 0
          }
          git commit -m "docs: regenerate command sequence audit"
          git push
